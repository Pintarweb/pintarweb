<div id="leads-view" class="space-y-0 flex-1 flex flex-col overflow-hidden">
    <div class="flex justify-between items-center mb-4">
        <div class="flex gap-4">
            <button id="folder-active" onclick="setFolder('active')"
                class="px-5 py-2 rounded-lg text-xs font-black transition-all folder-active border border-transparent shadow-sm">ACTIVE PIPELINE</button>
            <button id="folder-archived" onclick="setFolder('archived')"
                class="px-5 py-2 rounded-lg text-xs font-black transition-all text-slate-500 border border-transparent bg-slate-100">ARCHIVE VAULT</button>
        </div>
        <button onclick="openAddLeadModal()" class="px-5 py-2 rounded-lg text-xs font-black transition-all bg-blue-600 hover:bg-blue-700 text-white shadow-sm uppercase tracking-widest flex items-center gap-2">
            + Add Lead
        </button>
        <button onclick="exportToCRM()" class="px-5 py-2 rounded-lg text-xs font-black transition-all bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm uppercase tracking-widest flex items-center gap-2">
            Export to CRM (CSV) 📥
        </button>
    </div>

    <!-- Pipeline Progress Bar (rendered by JS) -->
    <div id="pipeline-progress" class="flex items-center gap-0 mb-1 bg-white p-2 rounded-xl border border-slate-100 shadow-sm overflow-x-auto"></div>
    <div id="pipeline-labels" class="flex mb-2 text-[8px] text-slate-400 font-black uppercase px-2 overflow-x-auto items-start"></div>

    <!-- Stats & Controls -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-2">
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Total Pipeline</p>
            <div class="flex items-baseline gap-2">
                <h3 id="lead-count" class="text-lg font-black text-slate-900">0 LEADS</h3>
                <span id="todays-new-count" class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full hidden">0 NEW TODAY</span>
            </div>
        </div>
        <div class="md:col-span-2 relative">
            <input type="text" id="search" placeholder="Search business name..."
                class="w-full h-full bg-white border border-slate-200 rounded-xl px-10 text-[11px] font-bold shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-300 text-base">🔍</span>
        </div>
        <button id="sort-btn" onclick="toggleSort()"
            class="bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl shadow-lg shadow-blue-200 transition-all uppercase text-[8px] tracking-widest">
            Highest Score ↓
        </button>
    </div>

    <!-- Filters Grid -->
    <div class="gap-1.5 mb-2 bg-white p-2 rounded-xl border border-slate-100 shadow-sm" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr))">
        <div class="space-y-0.5">
            <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest pl-1">Category</label>
            <select id="filter-category" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-1 rounded-lg text-[10px] font-bold outline-none h-7">
                <option value="All">All Industries</option>
            </select>
        </div>
        <div class="space-y-0.5">
            <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest pl-1">Stage</label>
            <div class="flex gap-1">
                <select id="filter-stage" onchange="applyFilters()"
                    class="flex-1 bg-slate-50 border border-slate-200 p-1 rounded-lg text-[10px] font-bold outline-none h-7">
                    <option value="new" selected>New Lead</option>
                    <option value="selected">⭐ Selected</option>
                    <option value="All">All Stages</option>
                    <option value="images_collected">Images Collected</option>
                    <option value="demo_ready">Demo Ready</option>
                    <option value="demo_built">Demo Built</option>
                    <option value="audit_ready">Audit Ready</option>
                    <option value="screenshot">Screenshot</option>
                    <option value="outreach_sent">Outreach Sent</option>
                    <option value="in_chat">In Chat</option>
                    <option value="qualified">Qualified</option>
                    <option value="payment">Payment</option>
                    <option value="active">Active Client</option>
                </select>
            </div>
        </div>
        <div class="space-y-0.5">
            <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest pl-1">Website</label>
            <select id="filter-website" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-1 rounded-lg text-[10px] font-bold outline-none h-7">
                <option value="All">Any State</option>
                <option value="Yes">Has Website</option>
                <option value="No">No Website</option>
            </select>
        </div>
        <div class="space-y-0.5">
            <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest pl-1">Source</label>
            <select id="filter-source" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-1 rounded-lg text-[10px] font-bold outline-none h-7">
                <option value="All">All Sources</option>
                <option value="Google Maps">Google Maps</option>
                <option value="Facebook">Facebook</option>
                <option value="Yellow Pages">Yellow Pages</option>
            </select>
        </div>
        <div class="space-y-0.5">
            <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest pl-1">Arrival</label>
            <select id="filter-arrival" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-1 rounded-lg text-[10px] font-bold outline-none h-7">
                <option value="All">All Time</option>
                <option value="Today">New Today</option>
                <option value="Week">This Week</option>
            </select>
        </div>
        <div class="space-y-0.5">
            <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest pl-1">Score</label>
            <select id="filter-score" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-1 rounded-lg text-[10px] font-bold outline-none h-7">
                <option value="0">Min. Score 0</option>
                <option value="5">Good (5+)</option>
                <option value="10">High Target (10+)</option>
            </select>
        </div>
    </div>

    <div id="pipeline-scroll" class="flex-1 overflow-y-auto min-h-0">
    <!-- Intake Panel Modal -->
    <div id="intake-panel" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="intake-title" class="text-xl font-black text-slate-900 uppercase tracking-tight">Lead Intake</h3>
                    <button onclick="closeIntakePanel()" class="text-slate-400 hover:text-slate-600 text-2xl font-black">×</button>
                </div>
                <div id="intake-body">
                    <!-- Filled dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Config Preview Modal -->
    <div id="config-preview-panel" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black text-slate-900 uppercase tracking-tight">Config Preview</h3>
                    <button onclick="closeConfigPreview()" class="text-slate-400 hover:text-slate-600 text-2xl font-black">×</button>
                </div>
                <div id="config-preview-body">
                    <!-- Filled dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Lead Modal -->
    <div id="add-lead-panel" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black text-slate-900 uppercase tracking-tight">Add New Lead</h3>
                    <button onclick="closeAddLeadModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-black">×</button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Business Name *</label>
                        <input type="text" id="add-lead-name" required
                            class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-[13px] font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Phone *</label>
                        <input type="tel" id="add-lead-phone" required placeholder="+60 or 01x-xxxxxxx"
                            class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-[13px] font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Category *</label>
                        <select id="add-lead-category" required
                            class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-[13px] font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                            <option value="">Select category...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Website URL</label>
                        <input type="url" id="add-lead-website" placeholder="https://..."
                            class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-[13px] font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Address</label>
                        <input type="text" id="add-lead-address"
                            class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-[13px] font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button onclick="closeAddLeadModal()"
                            class="flex-1 px-5 py-2.5 rounded-xl border border-slate-200 text-slate-500 font-black text-[10px] uppercase tracking-widest hover:bg-slate-50 transition-all">Cancel</button>
                        <button onclick="submitManualLead()"
                            class="flex-1 px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-[10px] uppercase tracking-widest shadow-md shadow-blue-200 transition-all">Add Lead</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leads Results List -->
    <div id="leads-container" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="text-center py-20 text-slate-300 font-bold uppercase tracking-widest">Waking up the Lead Engine...
        </div>
    </div>
    </div>
</div>
