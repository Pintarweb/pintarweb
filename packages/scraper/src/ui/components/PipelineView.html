<div id="leads-view" class="space-y-0">
    <div class="flex justify-between items-center mb-4">
        <div class="flex gap-4">
            <button id="folder-active" onclick="setFolder('active')"
                class="px-5 py-2 rounded-lg text-xs font-black transition-all folder-active border border-transparent shadow-sm">ACTIVE
                PIPELINE</button>
            <button id="folder-archived" onclick="setFolder('archived')"
                class="px-5 py-2 rounded-lg text-xs font-black transition-all text-slate-500 border border-transparent bg-slate-100">ARCHIVE
                VAULT</button>
        </div>
        <button onclick="exportToCRM()" class="px-5 py-2 rounded-lg text-xs font-black transition-all bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm uppercase tracking-widest flex items-center gap-2">
            Export to CRM (CSV) 📥
        </button>
    </div>

    <!-- Stats & Controls -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Pipeline</p>
            <h3 id="lead-count" class="text-3xl font-black text-slate-900">0 LEADS</h3>
        </div>
        <div class="md:col-span-2 relative">
            <input type="text" id="search" placeholder="Search business name..."
                class="w-full h-full bg-white border border-slate-200 rounded-2xl px-12 text-sm font-bold shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xl">🔍</span>
        </div>
        <button id="sort-btn" onclick="toggleSort()"
            class="bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl shadow-lg shadow-blue-200 transition-all uppercase text-[10px] tracking-widest">
            Highest Score ↓
        </button>
    </div>

    <!-- Filters Grid -->
    <div class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-10 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Category</label>
            <select id="filter-category" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg text-xs font-black outline-none h-10">
                <option value="All">All Industries</option>
            </select>
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Pipeline State</label>
            <select id="filter-status" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg text-xs font-black outline-none h-10">
                <option value="All">All Statuses</option>
                <option value="New">New Lead</option>
                <option value="Engaged">Engaged (Demo/Contacted)</option>
                <option value="Contacted">Contacted Only</option>
                <option value="Demo Built">Demo Built Only</option>
            </select>
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Website</label>
            <select id="filter-website" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg text-xs font-black outline-none h-10">
                <option value="All">Any State</option>
                <option value="Yes">Has Website</option>
                <option value="No">No Website</option>
            </select>
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Source</label>
            <select id="filter-source" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg text-xs font-black outline-none h-10">
                <option value="All">All Sources</option>
                <option value="Google Maps">Google Maps</option>
                <option value="Facebook">Facebook</option>
                <option value="Yellow Pages">Yellow Pages</option>
            </select>
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Arrival</label>
            <select id="filter-arrival" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg text-xs font-black outline-none h-10">
                <option value="All">All Time</option>
                <option value="Today">New Today</option>
                <option value="Week">This Week</option>
            </select>
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-1">Min. Score</label>
            <select id="filter-score" onchange="applyFilters()"
                class="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg text-xs font-black outline-none h-10">
                <option value="0">Min. Score 0</option>
                <option value="5">Good (5+)</option>
                <option value="10">High Target (10+)</option>
            </select>
        </div>
    </div>

    <!-- Leads Results List -->
    <div id="leads-container" class="space-y-4">
        <div class="text-center py-20 text-slate-300 font-bold uppercase tracking-widest">Waking up the Lead Engine...
        </div>
    </div>
</div>
