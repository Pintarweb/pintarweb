<div id="profiles-view" class="hidden space-y-8">
    <!-- Rotation Status Bar -->
    <div class="bg-slate-900 p-6 rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 p-4 opacity-5 text-6xl font-black">⟳</div>
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-2">Rotation Status</p>
                <div id="rotation-display" class="text-white">
                    <span class="text-slate-400">Loading...</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="fetchRotation()" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                    Refresh ⟳
                </button>
                <button onclick="resetRotation()" class="px-4 py-2 bg-orange-500/20 hover:bg-orange-500/30 text-orange-400 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                    Reset ↺
                </button>
            </div>
        </div>
    </div>

    <!-- Profiles Table -->
    <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h3 class="text-xl font-black text-slate-900 uppercase tracking-tight">Hunt Profiles</h3>
                <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mt-1" id="profile-count">0 profiles</p>
            </div>
            <button onclick="showAddProfile()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-blue-200 transition-all flex items-center gap-2">
                + Add Profile
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                        <th class="py-3 pr-2 w-16">#</th>
                        <th class="py-3 pr-4">Profile</th>
                        <th class="py-3 pr-4">Category</th>
                        <th class="py-3 pr-4">Location</th>
                        <th class="py-3 pr-4 text-center">Limit</th>
                        <th class="py-3 pr-4 text-center">Src</th>
                        <th class="py-3 pr-4 text-center">On</th>
                        <th class="py-3 pr-4">Last Run</th>
                        <th class="py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="profiles-container" class="text-sm">
                    <tr>
                        <td colspan="9" class="py-12 text-center text-slate-300 font-black uppercase tracking-widest">Loading profiles...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- History Modal -->
    <div id="profile-history-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="p-6 md:p-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 id="history-title" class="text-xl font-black text-slate-900 uppercase tracking-tight">Hunt History</h3>
                        <p id="history-subtitle" class="text-[10px] text-slate-400 font-black uppercase tracking-widest mt-1">Profile</p>
                    </div>
                    <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-black">×</button>
                </div>
                <div id="history-body">
                    <div class="text-center py-8 text-slate-300 font-black uppercase tracking-widest">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Profile Modal -->
    <div id="profile-form-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full">
            <div class="p-6 md:p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="profile-form-title" class="text-xl font-black text-slate-900 uppercase tracking-tight">Add Profile</h3>
                    <button onclick="closeProfileForm()" class="text-slate-400 hover:text-slate-600 text-2xl font-black">×</button>
                </div>
                <form id="profile-form" onsubmit="saveProfile(event)" class="space-y-4">
                    <input type="hidden" id="pf-id">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Profile Name</label>
                        <input id="pf-name" type="text" required
                            class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="e.g. aircond-kl">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Display Label</label>
                        <input id="pf-label" type="text" required
                            class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="e.g. Aircond — Kuala Lumpur">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Category</label>
                            <input id="pf-category" type="text" required
                                class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="e.g. Aircond Service">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Location</label>
                            <input id="pf-location" type="text" required
                                class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                                placeholder="e.g. Kuala Lumpur">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Limit</label>
                            <input id="pf-limit" type="number" value="50" min="1"
                                class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Sources</label>
                            <select id="pf-sources"
                                class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="Maps,FB">Maps + Facebook</option>
                                <option value="Maps">Maps Only</option>
                                <option value="FB">Facebook Only</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <input id="pf-enabled" type="checkbox" checked
                            class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <label class="text-sm font-bold text-slate-700">Enabled</label>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button type="submit"
                            class="flex-1 px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase shadow-lg shadow-blue-200 transition-all">
                            Save Profile
                        </button>
                        <button type="button" onclick="closeProfileForm()"
                            class="px-4 py-3 rounded-xl border border-slate-200 font-black text-xs uppercase hover:bg-slate-50 transition-all">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
