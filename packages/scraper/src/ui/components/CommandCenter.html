<div id="hunts-view" class="hidden flex-1 overflow-y-auto space-y-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Hunt Config -->
        <div class="lg:col-span-1 bg-white p-8 rounded-3xl border border-slate-200 shadow-xl overflow-hidden relative">
            <div class="absolute top-0 right-0 p-4 opacity-5 text-4xl font-black">COMMAND</div>
            <h3 class="text-xl font-black text-slate-900 mb-6 uppercase tracking-tight">Configure Hunt 🎯</h3>
            <div class="space-y-5">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label
                            class="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Category</label>
                        <span id="cat-sync-badge"
                            class="text-[8px] font-black bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded leading-none uppercase">...</span>
                    </div>
                    <input type="text" id="hunt-category" oninput="updateHuntCommand()" list="category-list"
                        placeholder="e.g. Plumber, Lawyer..."
                        class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all text-slate-900 placeholder-slate-300">
                    <datalist id="category-list"></datalist>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label
                            class="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Location</label>
                        <span id="loc-sync-badge"
                            class="text-[8px] font-black bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded leading-none uppercase">...</span>
                    </div>
                    <input type="text" id="hunt-location" oninput="updateHuntCommand()" list="location-list"
                        placeholder="e.g. Kuala Lumpur, Penang..."
                        class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all text-slate-900 placeholder-slate-300">
                    <datalist id="location-list"></datalist>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Limit /
                        Source</label>
                    <input type="number" id="hunt-limit" oninput="updateHuntCommand()" value="10"
                        class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <div>
                    <label
                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Sources</label>
                    <div class="flex flex-wrap gap-2 pt-2">
                        <label
                            class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer">
                            <input type="checkbox" checked value="Maps" onchange="updateHuntCommand()"
                                class="source-check">
                            <span class="text-xs font-bold">📍 Maps</span>
                        </label>
                        <label
                            class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer">
                            <input type="checkbox" checked value="FB" onchange="updateHuntCommand()"
                                class="source-check">
                            <span class="text-xs font-bold">📱 FB</span>
                        </label>
                        <label
                            class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-lg border border-slate-200 cursor-not-allowed opacity-50"
                            title="Deactivated due to high ban risk">
                            <input type="checkbox" disabled value="YP" onchange="updateHuntCommand()"
                                class="source-check text-slate-300">
                            <span class="text-xs font-bold text-slate-400">📖 YP (OFF)</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Command Display -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-6">
                    <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse shadow-lg shadow-red-500/50"></div>
                </div>
                <h4 class="text-slate-400 font-bold uppercase tracking-widest text-[10px] mb-4">Command Ready for
                    Execution</h4>
                <div class="bg-black/50 p-6 rounded-2xl border border-white/10 font-mono text-sm text-emerald-400 break-all"
                    id="command-output">
                    npx tsx src/index.ts --category "Interior Decorator" --location "Mont Kiara" --limit 10 --sources
                    Maps,FB
                </div>
                <div class="mt-6 flex flex-col md:flex-row items-center gap-4">
                    <button onclick="copyCommand(event)"
                        class="w-full md:w-auto px-10 py-4 bg-white text-slate-900 font-black rounded-2xl hover:bg-slate-100 transition-all shadow-xl uppercase text-xs tracking-widest">Copy
                        Command 📋</button>
                </div>
            </div>

            <!-- History -->
            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Hunt History Vault</h3>
                <table class="w-full text-left">
                    <thead class="border-b border-slate-100">
                        <tr class="text-[10px] font-black text-slate-400 uppercase">
                            <th class="py-3">Date</th>
                            <th class="py-3">Mission</th>
                            <th class="py-3">Sources</th>
                            <th class="py-3">Yield</th>
                        </tr>
                    </thead>
                    <tbody id="hunts-container" class="text-sm">
                        <tr>
                            <td colspan="4" class="py-10 text-center text-slate-300 font-bold italic">Checking
                                records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
