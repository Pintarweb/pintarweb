<section id="testimonials" class="py-12 md:py-16 reveal">
  <div class="max-w-6xl mx-auto px-4">

    <!-- Header -->
    <div class="flex flex-wrap items-end justify-between gap-4 mb-10">
      <div>
        <span class="inline-block px-3 py-1 text-xs font-bold uppercase tracking-wider mb-3"
              style="background:var(--color-primary);color:var(--color-bg);border:2px solid var(--color-text);box-shadow:3px 3px 0 0 var(--color-text);"
              data-bm="Apa Kata Pelanggan" data-en="Testimonials">
          Apa Kata Pelanggan
        </span>
        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight reveal"
            style="color:var(--color-text);"
            data-bm="Ulasan Tulen Dari Pelanggan Kami" data-en="Real Reviews From Our Customers">
          Ulasan Tulen Dari Pelanggan Kami
        </h2>
      </div>
      <a href="https://maps.google.com/?q={{BUSINESS_NAME}}" target="_blank"
         class="inline-flex items-center gap-1.5 text-sm font-bold reveal reveal-delay-2"
         style="color:var(--color-primary);">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span data-bm="{{GOOGLE_RATING}} ★ ({{GOOGLE_REVIEW_COUNT}} ulasan di Google)" data-en="{{GOOGLE_RATING}} ★ ({{GOOGLE_REVIEW_COUNT}} reviews on Google)">
          {{GOOGLE_RATING}} ★ ({{GOOGLE_REVIEW_COUNT}} ulasan di Google)
        </span>
      </a>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      {{TESTIMONIALS_HTML}}
    </div>

  </div>
</section>
