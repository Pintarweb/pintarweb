<section id="testimonials" class="py-12 md:py-16 reveal">
  <div class="max-w-6xl mx-auto px-4">

    <!-- Header -->
    <div class="text-left mb-10">
      <span class="inline-block px-3 py-1.5 text-xs font-bold uppercase tracking-widest rounded mb-3"
            style="background:var(--color-primary);color:var(--color-bg);"
            data-bm="Testimoni Pelanggan" data-en="Customer Testimonials">
        Testimoni Pelanggan
      </span>
      <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight"
          style="color:var(--color-text);"
          data-bm="Apa Kata Mereka Yang Sudah Servis Dengan Kami" data-en="What Our Customers Say">
        Apa Kata Mereka Yang Sudah Servis Dengan Kami
      </h2>
      <div class="flex items-center gap-2 mt-3 reveal reveal-delay-1">
        <div class="flex">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <span class="text-sm font-bold" style="color:var(--color-text);"
              data-bm="{{GOOGLE_RATING}} ({{GOOGLE_REVIEW_COUNT}} ulasan)" data-en="{{GOOGLE_RATING}} ({{GOOGLE_REVIEW_COUNT}} reviews)">
          {{GOOGLE_RATING}} ({{GOOGLE_REVIEW_COUNT}} ulasan)
        </span>
        <span class="text-xs opacity-60" style="color:var(--color-text);"
              data-bm="di Google" data-en="on Google">di Google</span>
        <a href="https://maps.google.com/?q={{BUSINESS_NAME}}" target="_blank"
           class="text-xs font-semibold underline ml-auto" style="color:var(--color-primary);"
           data-bm="Baca Semua" data-en="Read All">Baca Semua</a>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      {{TESTIMONIALS_HTML}}
    </div>

  </div>
</section>
