<section id="testimonials" class="py-12 md:py-16 overflow-hidden reveal">
  <div class="max-w-6xl mx-auto px-4">

    <!-- Header -->
    <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div>
        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight"
            style="color:var(--color-text);"
            data-bm="Apa Kata Pelanggan" data-en="What Customers Say">
          Apa Kata Pelanggan
        </h2>
        <p class="text-sm mt-1" style="color:var(--color-text);opacity:0.65;"
           data-bm="Lebih {{GOOGLE_REVIEW_COUNT}} ulasan di Google" data-en="Over {{GOOGLE_REVIEW_COUNT}} reviews on Google">
          Lebih {{GOOGLE_REVIEW_COUNT}} ulasan di Google
        </p>
      </div>
      <a href="https://maps.google.com/?q={{BUSINESS_NAME}}" target="_blank"
         class="inline-flex items-center gap-1.5 text-sm font-bold shrink-0"
         style="color:var(--color-primary);">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span data-bm="{{GOOGLE_RATING}} ★" data-en="{{GOOGLE_RATING}} ★">{{GOOGLE_RATING}} ★</span>
      </a>
    </div>

    <!-- Desktop: 3-column grid -->
    <div class="hidden md:grid md:grid-cols-3 gap-5">
      {{TESTIMONIALS_HTML}}
    </div>

    <!-- Mobile: horizontal scroll carousel -->
    <div class="md:hidden overflow-x-auto snap-x snap-mandatory -mx-4 px-4 pb-4"
         style="scrollbar-width:none;-ms-overflow-style:none;">
      <div class="flex gap-4">
        {{TESTIMONIALS_HTML}}
      </div>
    </div>

    <!-- Dot indicators -->
    <div class="flex justify-center gap-2 mt-6 md:hidden">
      <span class="w-2 h-2 rounded-full" style="background:var(--color-primary);"></span>
      <span class="w-2 h-2 rounded-full" style="background:var(--color-border);"></span>
      <span class="w-2 h-2 rounded-full" style="background:var(--color-border);"></span>
    </div>

  </div>
</section>
