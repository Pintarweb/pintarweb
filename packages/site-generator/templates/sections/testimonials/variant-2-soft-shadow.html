<section id="testimonials" class="py-12 md:py-16 reveal">
  <div class="max-w-6xl mx-auto px-4">

    <!-- Header -->
    <div class="text-center mb-12">
      <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-2"
          style="color:var(--color-text);"
          data-bm="Apa Kata Pelanggan" data-en="What Customers Say">
        Apa Kata Pelanggan
      </h2>
      <p class="text-sm" style="color:var(--color-text);opacity:0.65;"
         data-bm="Ulasan tulen dari pelanggan setia kami" data-en="Real reviews from our loyal customers">
        Ulasan tulen dari pelanggan setia kami
      </p>
      <div class="flex items-center justify-center gap-1.5 mt-3 reveal reveal-delay-1">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" style="color:var(--color-accent);"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span class="text-sm font-bold" style="color:var(--color-text);"
              data-bm="{{GOOGLE_RATING}} — {{GOOGLE_REVIEW_COUNT}} ulasan di Google" data-en="{{GOOGLE_RATING}} — {{GOOGLE_REVIEW_COUNT}} reviews on Google">
          {{GOOGLE_RATING}} — {{GOOGLE_REVIEW_COUNT}} ulasan di Google
        </span>
        <a href="https://maps.google.com/?q={{BUSINESS_NAME}}" target="_blank"
           class="text-xs font-semibold underline ml-1" style="color:var(--color-primary);"
           data-bm="Lihat" data-en="View">Lihat</a>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      {{TESTIMONIALS_HTML}}
    </div>

  </div>
</section>
