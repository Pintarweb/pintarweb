<footer style="background:var(--color-surface);border-top:1px solid var(--color-border);padding:32px 20px 100px;">
  <div style="max-width:1200px;margin:0 auto;">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:10px;">
        {{LOGO_HTML}}
        <span style="font-weight:700;font-size:17px;font-family:var(--font-heading);color:var(--color-text);">{{BUSINESS_NAME}}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        {{SOCIAL_LINKS_HTML}}
      </div>
    </div>
    <div style="border-top:1px solid var(--color-border);padding-top:16px;text-align:center;color:var(--color-muted);font-size:13px;">
      <span data-bm="© {{YEAR}} {{BUSINESS_NAME}} · Sejak {{ESTABLISHED}} · {{AREA}}" data-en="© {{YEAR}} {{BUSINESS_NAME}} · Since {{ESTABLISHED}} · {{AREA}}">© {{YEAR}} {{BUSINESS_NAME}} · Sejak {{ESTABLISHED}} · {{AREA}}</span>
    </div>
  </div>
</footer>

<div class="wa-sticky" style="display:none;">
  <a id="wa-sticky-link" href="https://wa.me/{{WHATSAPP}}?text={{WHATSAPP_TEXT_BM}}" target="_blank" rel="noopener" style="color:#fff;text-decoration:none;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;" data-wa-bm="{{WHATSAPP_TEXT_BM}}" data-wa-en="{{WHATSAPP_TEXT_EN}}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span data-bm="Hubungi via WhatsApp" data-en="Contact via WhatsApp">Hubungi via WhatsApp</span>
  </a>
</div>
<script>
(function(){
  var wa=document.querySelector('.wa-sticky');
  if(window.innerWidth<768&&wa)wa.style.display='flex';
  var checkWa=function(){if(wa)wa.style.display=window.innerWidth<768?'flex':'none';};
  window.addEventListener('resize',checkWa);
})();
function updateWaLinks(){
  var lang=localStorage.getItem('pw_lang')||'bm';
  document.querySelectorAll('[data-wa-bm]').forEach(function(el){
    var msg=lang==='bm'?el.getAttribute('data-wa-bm'):el.getAttribute('data-wa-en');
    if(msg&&el.tagName==='A')el.href=el.href.split('?')[0]+'?text='+msg;
  });
}
document.addEventListener('DOMContentLoaded',updateWaLinks);
</script>
