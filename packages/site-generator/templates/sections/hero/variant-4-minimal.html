<section id="hero" class="pt-20 pb-12 md:pb-20" style="background:var(--color-bg);">
  <div class="max-w-3xl mx-auto px-4 text-center">
    <h1 class="text-3xl md:text-5xl font-bold leading-tight tracking-tight reveal" style="color:var(--color-text);font-family:var(--font-heading);" data-bm="{{BUSINESS_NAME}}" data-en="{{BUSINESS_NAME}}">{{BUSINESS_NAME}}</h1>
    <p class="text-base md:text-lg mt-4 max-w-xl mx-auto reveal reveal-delay-1" style="color:var(--color-muted);" data-bm="{{TAGLINE}}" data-en="{{TAGLINE_EN}}">{{TAGLINE}}</p>
    <div class="mt-8 reveal reveal-delay-2">
      <a href="https://wa.me/{{WHATSAPP}}?text={{WHATSAPP_TEXT_BM}}" data-wa-bm="{{WHATSAPP_TEXT_BM}}" data-wa-en="{{WHATSAPP_TEXT_EN}}" class="inline-flex items-center gap-2 px-8 py-4 font-extrabold text-sm uppercase tracking-wider transition-all" style="background:#25D366;color:#fff;border:2px solid var(--color-text);box-shadow:var(--shadow-style, 4px 4px 0px 0px var(--color-primary));" data-bm="WhatsApp Sekarang" data-en="WhatsApp Now">WhatsApp Sekarang</a>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-12 reveal reveal-delay-3">
      <div class="p-4" style="background:var(--color-surface);border:2px solid var(--color-border);">
        <p class="font-black text-sm uppercase tracking-wider" style="color:var(--color-primary);" data-bm="Servis Professional" data-en="Professional Service">Servis Professional</p>
        <p class="text-xs mt-1" style="color:var(--color-muted);" data-bm="Teknisi bertauliah & berpengalaman" data-en="Certified & experienced technicians">Teknisi bertauliah & berpengalaman</p>
      </div>
      <div class="p-4" style="background:var(--color-surface);border:2px solid var(--color-border);">
        <p class="font-black text-sm uppercase tracking-wider" style="color:var(--color-primary);" data-bm="Harga Telus" data-en="Transparent Pricing">Harga Telus</p>
        <p class="text-xs mt-1" style="color:var(--color-muted);" data-bm="Sebut harga awal, tiada cas tersembunyi" data-en="Upfront quote, no hidden fees">Sebut harga awal, tiada cas tersembunyi</p>
      </div>
      <div class="p-4" style="background:var(--color-surface);border:2px solid var(--color-border);">
        <p class="font-black text-sm uppercase tracking-wider" style="color:var(--color-primary);" data-bm="Respons Pantas" data-en="Fast Response">Respons Pantas</p>
        <p class="text-xs mt-1" style="color:var(--color-muted);" data-bm="Sedia membantu 7 hari seminggu" data-en="Ready to help 7 days a week">Sedia membantu 7 hari seminggu</p>
      </div>
    </div>
  </div>
</section>
