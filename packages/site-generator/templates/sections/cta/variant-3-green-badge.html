<!-- CTA banner | variant: green-badge | Mood: trustworthy-local -->
<section class="reveal w-full bg-[var(--color-primary,#1B4332)] border-y-4 border-[var(--color-primary-soft,#2D6A4F)] py-14 md:py-18 px-4 my-12">
  <div class="max-w-6xl mx-auto flex flex-col lg:flex-row lg:items-center lg:justify-between gap-8">

    <!-- Left: Text -->
    <div class="flex flex-col items-start max-w-xl">
      <!-- Amber badge -->
      <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-[var(--color-accent,#F59E0B)] text-stone-900 text-xs font-extrabold uppercase tracking-wider mb-4 shadow-[3px_3px_0px_0px_rgba(0,0,0,0.25)]"
            data-bm="Servis Segera" data-en="Fast Service">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span data-bm="Servis Segera" data-en="Fast Service">Servis Segera</span>
      </span>
      <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight mb-3 leading-tight"
          data-bm="{{CATEGORY}} Tetiba Rosak? Kami Bantu"
          data-en="{{CATEGORY_EN}} Suddenly Broken? We Can Help">
        {{CATEGORY}} Tetiba Rosak? Kami Bantu
      </h2>
      <p class="text-emerald-100/80 text-sm md:text-base max-w-lg leading-relaxed"
         data-bm="Masalah {{CATEGORY}} tak boleh tunggu. Teknisi berpengalaman kami siap sedia di {{AREA}}. Sebut harga percuma, tiada komitmen."
         data-en="{{CATEGORY_EN}} problems can't wait. Our experienced technicians are ready in {{AREA}}. Free quote, no obligation.">
        Masalah {{CATEGORY}} tak boleh tunggu. Teknisi berpengalaman kami siap sedia di {{AREA}}. Sebut harga percuma, tiada komitmen.
      </p>
    </div>

    <!-- Right: Buttons -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 shrink-0">
      <a href="https://wa.me/{{WHATSAPP}}?text={{WHATSAPP_TEXT_BM}}"
         class="inline-flex items-center justify-center gap-2.5 bg-[#25D366] text-stone-900 font-extrabold px-6 py-3.5 border-2 border-stone-900 transition-all duration-150 shadow-[5px_5px_0px_0px_rgba(0,0,0,0.3)] hover:translate-x-[3px] hover:translate-y-[3px] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,0.3)] text-sm uppercase tracking-wider"
         data-wa-bm="{{WHATSAPP_TEXT_BM}}" data-wa-en="{{WHATSAPP_TEXT_EN}}">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.116 1.526 5.845L.057 23.885l6.197-1.624A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.003-1.366l-.358-.213-3.722.976.993-3.63-.234-.373A9.818 9.818 0 1112 21.818z"/>
        </svg>
        <span data-bm="Tempah Sekarang" data-en="Book Now">Tempah Sekarang</span>
      </a>
      <a href="tel:{{PHONE}}"
         class="inline-flex items-center justify-center gap-2 bg-white text-[var(--color-primary,#1B4332)] font-extrabold px-6 py-3.5 border-2 border-stone-900 transition-all duration-150 shadow-[5px_5px_0px_0px_rgba(0,0,0,0.3)] hover:translate-x-[3px] hover:translate-y-[3px] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,0.3)] text-sm uppercase tracking-wider">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span data-bm="Panggil {{PHONE}}" data-en="Call {{PHONE}}">Panggil {{PHONE}}</span>
      </a>
    </div>

  </div>
</section>
