<!-- Gallery with Lightbox Component -->
<!-- Images use client-specific paths: images/gallery-1.webp etc. -->
<!-- The lightbox opens on click, closes on Escape or background click -->
<section id="gallery" class="py-12 md:py-16">
  <div class="max-w-5xl mx-auto px-4">
    <h2 class="text-2xl md:text-3xl font-bold mb-8 text-center reveal"
        data-bm="Galeri Kerja Kami" data-en="Our Work Gallery">
      Galeri Kerja Kami
    </h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
      <div class="gallery-item reveal cursor-pointer overflow-hidden group" onclick="openLightbox('images/gallery-1.webp')">
        <img src="images/gallery-1.webp" alt="Gallery 1" class="w-full h-48 md:h-64 object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy">
      </div>
      <div class="gallery-item reveal reveal-delay-1 cursor-pointer overflow-hidden group" onclick="openLightbox('images/gallery-2.webp')">
        <img src="images/gallery-2.webp" alt="Gallery 2" class="w-full h-48 md:h-64 object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy">
      </div>
      <div class="gallery-item reveal reveal-delay-2 cursor-pointer overflow-hidden group" onclick="openLightbox('images/gallery-3.webp')">
        <img src="images/gallery-3.webp" alt="Gallery 3" class="w-full h-48 md:h-64 object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy">
      </div>
    </div>
  </div>
</section>

<!-- Lightbox overlay -->
<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
  <img id="lightbox-img" src="" alt="Gallery image">
</div>

<script>
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e.target === e.currentTarget || e.key === 'Escape') {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
}
document.addEventListener('keydown', closeLightbox);
</script>
