<!-- Bot promo banner — injected into demo sites and audit pages -->
<div id="bot-promo-banner" style="position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,{{BANNER_BG}} 0%,{{BANNER_BG_END}} 100%);border-bottom:1px solid {{BANNER_ACCENT}};padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:9999;font-family:'Inter',sans-serif;">
  <span style="color:{{BANNER_TEXT}};font-size:13px;">Nak try bot WhatsApp kami dulu sebelum decide?</span>
  <a href="{{LANDING_URL}}" target="_blank" style="background:#25D366;color:#fff;text-decoration:none;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;">Cuba Bot Kami →</a>
  <button onclick="var p=document.getElementById('bot-promo-banner');p.style.display='none';sessionStorage.setItem('banner-dismissed','1');" style="background:none;border:none;color:{{BANNER_CLOSE}};cursor:pointer;font-size:18px;padding:0 4px;line-height:1;">×</button>
</div>
<script>if(sessionStorage.getItem('banner-dismissed')){var b=document.getElementById('bot-promo-banner');if(b)b.style.display='none';}</script>
